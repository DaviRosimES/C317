name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: c317_test
      POSTGRES_USER: c317_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_PORT: 5432
      AUTH_SECRET_KEY: segredo-do-ci-somente-para-testes-automatizados
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: c317_test
          POSTGRES_USER: c317_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c317_test -d c317_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r backend/requirements.txt
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      # A V4 depende de Depends(scope="function"); confere a versão mínima fixada.
      - name: Regressão da V4 com a versão mínima do FastAPI
        run: |
          python -m pip install "fastapi==0.142.1"
          python -m pytest -q tests/test_confirmacao_transacao.py
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      # typecheck (tsc -b) + build do Vite
      - run: pnpm --dir frontend build
