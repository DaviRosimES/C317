name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: c317_test
      POSTGRES_USER: c317_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_PORT: 5432
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: c317_test
          POSTGRES_USER: c317_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c317_test -d c317_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r backend/requirements.txt
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
